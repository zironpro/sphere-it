name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zironpro/sphere-it:latest

jobs:
  # ==========================================
  # Build Docker image and push to GHCR
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Build and push Docker image
      # ----------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

          # Disable cache temporarily so we can
          # verify BUILD_ENV is actually injected
          no-cache: true

          # Pass BUILD_ENV securely to Docker BuildKit
          secrets: |
            env_file=${{ secrets.BUILD_ENV }}

  # ==========================================
  # Deploy image to production server
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to sphereweb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "======================================"
            echo "Pulling latest application image..."
            echo "======================================"

            sudo docker compose pull app

            echo "======================================"
            echo "Updating application..."
            echo "======================================"

            sudo docker compose up -d --no-deps app

            echo "======================================"
            echo "Cleaning unused images..."
            echo "======================================"

            sudo docker image prune -f

            echo "======================================"
            echo "Deployment completed."
            echo "======================================"
