name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zironpro/sphere-it:latest

jobs:
  # ==========================================
  # BUILD AND PUSH
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

          # Disable cache for this test
          no-cache: true

          # Build-time environment variables
          # These are dummy values only.
          # Production values remain on the server.
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}
            LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}
            RECEIVER_EMAIL=${{ secrets.RECEIVER_EMAIL }}
            CAREERS_EMAIL=${{ secrets.CAREERS_EMAIL }}
            BASE_URL=${{ secrets.BASE_URL }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}

  # ==========================================
  # DEPLOY TO PRODUCTION
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to sphereweb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "======================================"
            echo "Pulling latest application image..."
            echo "======================================"

            sudo docker compose pull app

            echo "======================================"
            echo "Updating application..."
            echo "======================================"

            sudo docker compose up -d --no-deps app

            echo "======================================"
            echo "Cleaning unused images..."
            echo "======================================"

            sudo docker image prune -f

            echo "======================================"
            echo "Deployment completed."
            echo "======================================"
