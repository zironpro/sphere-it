name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/zironpro/sphere-it:latest

jobs:
  # ==========================================
  # BUILD AND PUSH
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

          # Disable cache for this test
          no-cache: true

          # Build-time environment variables
          # These are dummy values only.
          # Production values remain on the server.
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            LINKEDIN_CLIENT_ID=build-client-id
            LINKEDIN_CLIENT_SECRET=build-client-secret
            RECEIVER_EMAIL=build@example.com
            CAREERS_EMAIL=build@example.com
            BASE_URL=https://sphereitglobal.com

  # ==========================================
  # DEPLOY TO PRODUCTION
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to sphereweb
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            echo "======================================"
            echo "Pulling latest application image..."
            echo "======================================"

            sudo docker compose pull app

            echo "======================================"
            echo "Updating application..."
            echo "======================================"

            sudo docker compose up -d --no-deps app

            echo "======================================"
            echo "Cleaning unused images..."
            echo "======================================"

            sudo docker image prune -f

            echo "======================================"
            echo "Deployment completed."
            echo "======================================"
